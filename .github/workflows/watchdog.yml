# Сторож. Бот отмечается «жив» в ветке state каждые 20 минут; если отметка
# протухла, значит смена оборвалась — поднимаем цепочку заново и пишем владельцу.
# Молчание бота иначе выглядит как «просто ничего не происходит».
name: watchdog

on:
  schedule:
    # Раз в час: порог протухания 45 минут, значит о смерти узнаём в пределах часа.
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Прислать тестовый пуш, не трогая бота'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: state
          fetch-depth: 1

      - name: Check heartbeat
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f bot-state.json ]; then
            echo "state file missing — нечего проверять"
            exit 0
          fi
          BEAT=$(jq -r '.heartbeat // ""' bot-state.json)
          OWNER=$(jq -r '.ownerId // empty' bot-state.json)
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          # Пустой пульс сам по себе ещё не тревога — но только пока смена идёт.
          # Иначе «сторож молчит» означало бы «бот мёртв и об этом никто не узнает».
          if [ -z "$BEAT" ]; then
            LIVE=$(gh run list -R "$GITHUB_REPOSITORY" -w bot-runner \
              --status in_progress --limit 1 --json databaseId --jq 'length')
            if [ "$LIVE" = "1" ]; then
              echo "пульса ещё нет, но смена идёт — ждём первой отметки"
              exit 0
            fi
            echo "ни пульса, ни работающей смены"
            echo "age=0" >> "$GITHUB_OUTPUT"
            echo "stale=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE=$(( $(date -u +%s) - $(date -u -d "$BEAT" +%s) ))
          echo "последний пульс: $BEAT (${AGE}s назад)"
          echo "age=$AGE" >> "$GITHUB_OUTPUT"
          # 45 минут: пульс раз в 20 минут плюс запас на пересменку и первый скан.
          if [ "$AGE" -gt 2700 ]; then
            echo "stale=1" >> "$GITHUB_OUTPUT"
            echo "::warning::Бот молчит ${AGE}s — поднимаю смену"
          fi

      - name: Restart the bot
        if: steps.check.outputs.stale == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable bot-runner -R "$GITHUB_REPOSITORY" || true
          gh workflow run bot-runner -R "$GITHUB_REPOSITORY"

      - name: Tell the owner
        if: (steps.check.outputs.stale == '1' || inputs.test_alert) && steps.check.outputs.owner != ''
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          MINUTES=$(( ${{ steps.check.outputs.age || 0 }} / 60 ))
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            TEXT="🔧 Проверка сторожа. Так будет выглядеть уведомление, если бот замолчит — он же его и починит. Ничего делать не нужно."
          elif [ "$MINUTES" -gt 0 ]; then
            TEXT="⚠️ Бот молчал ${MINUTES} мин — смена оборвалась. Запустил заново, данные не потеряны."
          else
            TEXT="⚠️ Бот не работал — смены не было. Запустил заново, данные не потеряны."
          fi
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${{ steps.check.outputs.owner }}" \
            --data-urlencode "text=${TEXT}" \
            -o /dev/null -w "telegram: %{http_code}\n"
