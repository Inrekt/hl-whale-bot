# 24/7 бот на GitHub Actions: job живёт ~5ч45м (лимит GitHub — 6ч),
# перед смертью сам запускает следующий. Старт цепочки — вручную (Run workflow).
name: bot-runner

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # страховка: если цепочка оборвалась, поднимаемся сами

concurrency:
  group: bot-runner
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install fonts (Cyrillic + emoji for cards)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji
      - run: npm ci
      - name: Restore state branch as worktree
        run: |
          git fetch origin state || true
          if git rev-parse --quiet --verify origin/state >/dev/null; then
            git worktree add state origin/state
          else
            git worktree add --orphan -b state state || { git checkout --orphan state && git rm -rf . && git commit --allow-empty -m init && git push origin state && git checkout main && git worktree add state origin/state; }
          fi
      - name: Long-poll bot
        id: bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STATE_GIT: '1'
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN secret is not set — nothing to run yet"
            exit 0
          fi
          started=$(date +%s)
          npx tsx src/main.ts --max-runtime-minutes 340 || true
          echo "uptime_sec=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
      # Цепочку продолжаем ТОЛЬКО если бот реально прожил смену. Быстрый выход
      # значит системную поломку (протухший токен и т.п.) — иначе получаем шторм
      # перезапусков раз в минуту. Из такой паузы нас вытащит cron выше.
      - name: Chain next run
        if: always() && steps.bot.outputs.uptime_sec != '' && steps.bot.outputs.uptime_sec > 1800
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot-runner.yml -R "$GITHUB_REPOSITORY"
      - name: Report short run
        if: always() && steps.bot.outputs.uptime_sec != '' && steps.bot.outputs.uptime_sec <= 1800
        run: |
          echo "::error::Бот прожил ${{ steps.bot.outputs.uptime_sec }}с (<30 мин) — цепочка остановлена."
          echo "Проверь BOT_TOKEN. Следующая попытка — по расписанию cron."
          exit 1
